<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}{{ profile.name }} - {{ profile.title }}{% endblock %}</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">

{% block extra_head %}{% endblock %}
</head>
<body>

<!-- ============ NAVBAR ============ -->
<nav class="navbar navbar-expand-lg portfolio-navbar">
  <div class="container">
    <a class="navbar-brand" href="{{ url_for('index') }}">
      <span class="brand-mark">
        <i class="bi bi-hdd-network-fill"></i>
      </span>
      <div class="brand-text">
        <div class="brand-name">{{ profile.name }}</div>
        <div class="brand-tagline">{{ profile.title }}</div>
      </div>
    </a>

    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="navMenu">
      <ul class="navbar-nav ms-auto">
        <li class="nav-item">
          <a class="nav-link" href="{{ url_for('index') }}#about">About</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="{{ url_for('index') }}#skills">Skills</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="{{ url_for('projects') }}">Projects</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="{{ url_for('index') }}#contact">Contact</a>
        </li>
        <li class="nav-item ms-2">
          <a class="nav-link btn-github" href="{{ profile.github }}" target="_blank">
            <i class="bi bi-github"></i> GitHub
          </a>
        </li>
      </ul>
    </div>
  </div>
</nav>

<!-- ============ MAIN CONTENT ============ -->
<main class="main-content">
  {% block content %}{% endblock %}
</main>

<!-- ============ FOOTER ============ -->
<footer class="portfolio-footer">
  <div class="container">
    <div class="row align-items-center">
      <div class="col-md-6">
        <p class="mb-0">© {{ year }} <strong>{{ profile.name }}</strong>. All rights reserved.</p>
      </div>
      <div class="col-md-6 text-md-end">
        <div class="social-links">
          <a href="{{ profile.github }}" target="_blank" title="GitHub"><i class="bi bi-github"></i></a>
          <a href="{{ profile.linkedin }}" target="_blank" title="LinkedIn"><i class="bi bi-linkedin"></i></a>
          <a href="mailto:{{ profile.email }}" title="Email"><i class="bi bi-envelope-fill"></i></a>
        </div>
      </div>
    </div>
  </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="{{ url_for('static', filename='js/main.js') }}"></script>
{% block extra_scripts %}{% endblock %}
</body>
</html>
